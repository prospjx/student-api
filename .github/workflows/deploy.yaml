name: StudentAPI CD

on:
  workflow_run:
    workflows: ["StudentAPI CI"]
    types:
      - completed
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Ensure Image Pull Secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Deploy with Helm
        run: |
          helm upgrade --install studentapi ./helm \
            --set image.tag="v${{ github.event.workflow_run.run_number }}" \
            --set postgres.password='${{ secrets.POSTGRES_PASSWORD }}' \
            --wait \
            --timeout 120s

      - name: Check rollout diagnostics on failure
        if: failure()
        run: |
          echo "::error::Deployment failed. Fetching pod diagnostics..."
          echo "=== POD STATUS ==="
          kubectl get pods -l app=studentapi -o wide
          echo "=== POD EVENTS & DESCRIPTION ==="
          kubectl describe pods -l app=studentapi
          echo "=== POD LOGS ==="
          kubectl logs -l app=studentapi --tail=100 --all-containers=true
